tools:
  ffmpeg:
    ffmpeg-path: "C:/ffmpeg/bin/ffmpeg.exe"
    ffprobe-path: "C:/ffmpeg/bin/ffprobe.exe"

  media:
    # Thư mục lưu ảnh/video. Đường dẫn tương đối tính từ nơi chạy backend.
    # Production nên đặt đường dẫn tuyệt đối ngoài thư mục build,
    # nếu không deploy lại là mất hết file.
    storage-dir: ./data/media

  pkcs11:
    # Cấu hình USB token RIÊNG cho tính năng ký số PDF (/api/tools/sign).
    # Tách khỏi viettel.einvoice.pkcs11-* và dùng provider tên khác
    # (SunPKCS11-ToolsToken) để hai luồng không tranh nhau slot.
    # Có thể trỏ tới cùng một token vật lý.
    library-path: "C:/Windows/System32/winca_csp11_v1.dll"
    slot-index: 0

    # Rỗng = lấy key entry đầu tiên tìm thấy trong token
    key-alias: ""

    sign-logo-path: ""        # "" = tự tìm ở classpath; "none" = tắt ảnh dấu
    sign-logo-scale: 0.7          # tạo chỗ trống 30% chiều cao
    sign-logo-offset-lines: 3     # dịch lên 3 dòng
    sign-logo-opacity: 0.15

    # Font có dấu tiếng Việt cho tên người ký.
    # Server Linux PHẢI đổi đường dẫn, ví dụ:
    #   /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    # Không đổi thì tên người ký trên PDF bị mất dấu.
    font-regular-path: "C:/Windows/Fonts/arial.ttf"
  security:
    # TTL token khi user tick "Ghi nhớ đăng nhập", ms.
    # Mặc định 7 ngày. Không tick → token 12 giờ (hardcode trong ToolsAuthController).
    jwt-ttl-ms: 604800000

    # Mật khẩu ban đầu của 2 tài khoản mặc định (chỉ dùng lần khởi động đầu
    # KHI bảng tools_user còn trống). Sau đó không có tác dụng, đổi trong UI.
    seed-admin-password: "1412"
    seed-user-password:  "123"


